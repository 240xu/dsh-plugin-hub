name: msgops-tool-report
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p audit
          URL=$(curl -fsSL "https://registry.npmjs.org/@240xu%2Fdsh-message-ops/0.11.0" | python3 -c "import json,sys;print(json.load(sys.stdin)['dist']['tarball'])")
          curl -fsSL "$URL" -o /tmp/m.tgz
          rm -rf /tmp/m && mkdir -p /tmp/m && tar -xzf /tmp/m.tgz -C /tmp/m
          {
            echo '## tool action enum'
            grep -RIn "action.*enum\|export const.*action\|action:.*list" /tmp/m/package/src/*.js | head -30
            echo '## tool registration'
            grep -RIn "message_ops\|registerTool\|action: z\|z.enum" /tmp/m/package/src/*.js | head -40
            echo '## index branch/export refs'
            grep -n "branch\|export" /tmp/m/package/src/index.js | head -40
          } > audit/msgops-tool-011.md
      - run: |
          git config user.name 240xu
          git config user.email 240xu@users.noreply.github.com
          git add audit/msgops-tool-011.md
          git commit -m 'audit: message-ops 0.11.0 tool actions' || true
          git push
