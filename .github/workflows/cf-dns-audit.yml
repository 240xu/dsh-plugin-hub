name: cf-dns-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query CF DNS
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          set -e
          for n in dsh tcp ssh2; do
            echo "=== $n.sepic.space"
            curl -fsSL -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/f47ca70bfdf07688e9ae4caf73d14d7b/dns_records?name=$n.sepic.space" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r['type'],r['name'],r['content'],r.get('proxied')) for r in d.get('result',[])]"
          done
