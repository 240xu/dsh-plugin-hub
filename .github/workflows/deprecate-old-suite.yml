name: deprecate-old-suite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate old package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate @240xu/dsh-suite "Renamed to @240xu/dsh-plugin-hub. Install: dsh plugin --profile web add @240xu/dsh-plugin-hub"
          npm view @240xu/dsh-suite deprecated --registry=https://registry.npmjs.org/
