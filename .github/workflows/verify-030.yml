name: verify-030
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL https://registry.npmjs.org/@240xu%2Fdsh-plugin-hub | python3 -c "import json,sys;d=json.load(sys.stdin);v=d['dist-tags']['latest'];print('latest',v);print('deps',d['versions'][v]['dependencies'])"; then exit 0; fi
            sleep 10
          done
          exit 1
