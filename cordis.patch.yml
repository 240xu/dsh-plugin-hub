# @240xu/dsh-plugin-hub bundle layer：一条裸锚行（本包根，提供 browser client
# graph entry）+ 四条 family 行（x240-*，经本包 shell 子路径）+ 一条 web 接线行。
# 挂载（会签方案 aggregation-weball.md §7 MVA：行 name → @240xu/dsh-plugin-hub/<family>
# （永不失败的隔离壳），真实包名放 config.plugin，由 shell 动态 import——
# 任一子包 import/start 失败只降级该行，不拖垮 bundle 事务组、不 abort dsh web。
# 裸锚行的 host apply 只持有 /degraded + /rows 路由；它的 client bundle 折入
# message-ops/websearch 的 UI，并按 /rows 的 active 行 gate 挂载。
# id 统一 x240- 前缀：与各子包 standalone patch 的 id（dsh-websearch 等）不冲突，
# suite 与 standalone 可共存（浏览器半 standalone 优先；宿主工具可能有一行
# already registered 警告，见 README）。
# 若验证期需要绕过 shell 直接挂子包，把 name 换成子包名并删掉 config 即可
# （对照行保留在文件尾注释）。
- insert:
    - id: x240-suite
      name: '@240xu/dsh-plugin-hub'
- insert:
    - id: x240-websearch
      name: '@240xu/dsh-plugin-hub/websearch'
      config:
        plugin: '@240xu/dsh-websearch'
- insert:
    - id: x240-message-ops
      name: '@240xu/dsh-plugin-hub/message-ops'
      config:
        plugin: '@240xu/dsh-message-ops'
- insert:
    - id: x240-session-lazy-view
      name: '@240xu/dsh-plugin-hub/session-lazy-view'
      config:
        plugin: '@240xu/dsh-session-lazy-view'
    - id: x240-session-search
      name: '@240xu/dsh-plugin-hub/session-search'
      config:
        plugin: '@240xu/dsh-session-search'

# 对照（不启用）：无 shell 直挂形态，即任务书 2) 的字面读法——
# - insert:
#     - id: x240-websearch
#       name: '@240xu/dsh-websearch'
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: unified
